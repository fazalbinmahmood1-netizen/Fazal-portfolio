<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Fazal · Site Manager</title><style>
@import url('/assets/font-source.css');:root{--accent:#037c83;--ink:#10262c;--muted:#66787d;--line:#dae4e5;--bg:#f3f7f7}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button,a,input,select,textarea{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #00b7bd}aside{width:224px;position:fixed;inset:0 auto 0 0;background:#092329;color:#d8e6e8;padding:28px 18px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:600;color:white;letter-spacing:-.6px}.brand em{font-style:normal;color:#6df0ed}.subtitle{font-size:11px;letter-spacing:2px;color:#85a4aa;margin:4px 0 38px}nav{display:grid;gap:6px}nav button{border:0;background:transparent;color:#b9cdd1;text-align:left;padding:12px 15px;border-radius:7px}nav button.active{background:#164047;color:#9bffff}nav button:hover{background:#12363d}.aside-bottom{margin-top:auto;border-top:1px solid #29464c;padding-top:20px;font-size:12px}.aside-bottom a{color:#c1d5d9;display:block;margin:10px 0}.workspace{margin-left:224px}header{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;padding:20px 32px;border-bottom:1px solid var(--line)}header h1{font-size:21px;margin:0}.header-note{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid #c9d8db;background:white;border-radius:7px;padding:10px 16px;color:var(--ink);text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:6px;font-weight:500}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:hover{filter:brightness(.96)}.badge{font-size:11px;background:#e8f5f1;color:#17644f;padding:5px 9px;border-radius:30px}.dirty{background:#fff3d8;color:#8d5e08}main{padding:30px 32px}.intro{margin-bottom:24px}h2{font-size:28px;line-height:1.2;letter-spacing:-.6px;margin:0 0 10px}h3{font-size:17px;margin:0 0 15px}p{margin:0 0 14px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}.metric{font-size:38px;font-weight:600;margin:14px 0}.eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:1.6px;font-size:10px}.toolbar{display:flex;gap:12px;justify-content:space-between;margin-bottom:18px}.toolbar input{max-width:360px}.list{display:grid;gap:10px}.row{background:white;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 20px}.row h3{margin:0 0 4px;font-size:15px}.row small{color:var(--muted);overflow-wrap:anywhere}.editor{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:22px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}.preview{position:sticky;top:110px}.preview-tools{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.preview-wrap{background:#dce5e6;border:1px solid #c5d4d7;border-radius:10px;padding:12px;overflow:auto;display:flex;justify-content:center}iframe{border:0;background:#fff;width:100%;height:70vh;min-height:500px;border-radius:4px}label{display:block;font-weight:500;margin:18px 0 7px}input,textarea,select{width:100%;border:1px solid #c7d6d9;border-radius:6px;padding:10px 12px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical;line-height:1.6}input[type=color]{padding:4px;width:50px;height:40px}input[type=range]{padding:0}input[type=checkbox]{width:auto;margin-right:8px}.field{padding-bottom:18px;border-bottom:1px solid #e8eeee}.field:last-child{border:0}.field small{color:var(--muted)}.image-preview{max-width:100%;max-height:150px;object-fit:contain;border:1px solid var(--line);border-radius:6px;margin:12px 0;background:#e9eeee}.split{display:flex;gap:12px;align-items:center}.split>input:not([type=color]){flex:1}.hint{font-size:12px;margin-top:8px}.notice{padding:16px 20px;background:#e6f4f3;border:1px solid #c1dfdd;border-radius:8px;color:#255d60;margin-bottom:20px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#102e36;color:#fff;padding:13px 22px;border-radius:8px;box-shadow:0 10px 35px #0002;z-index:20;max-width:90vw}.toast.error{background:#8b2929}dialog{border:1px solid var(--line);border-radius:12px;max-width:500px;width:92%;padding:28px;color:var(--ink)}dialog::backdrop{background:#071d2966}.empty{text-align:center;padding:60px}.section-title{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}.bottom-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.loading{padding:70px;text-align:center}.file-input{display:none}a{color:var(--accent)}.mobile-nav{display:none}
@media(max-width:1100px){aside{width:190px}.workspace{margin-left:190px}main,header{padding:22px}.editor{grid-template-columns:1fr}.preview{position:static}.grid{grid-template-columns:repeat(3,1fr)}iframe{height:650px}}
@media(max-width:700px){aside{position:static;width:100%;padding:18px}.subtitle,.aside-bottom{display:none}nav{display:flex;overflow:auto;gap:4px;margin-top:14px}nav button{white-space:nowrap;padding:8px 12px}.workspace{margin-left:0}header{position:static;flex-wrap:wrap;padding:18px}.actions{width:100%;flex-wrap:wrap}main{padding:18px}.grid{grid-template-columns:1fr}.metric{font-size:28px}.editor{display:block}.preview{margin-top:20px}.panel,.card{padding:20px}.row{padding:15px;gap:12px}.toolbar{flex-wrap:wrap}h2{font-size:24px}.preview-wrap{padding:6px}iframe{min-height:450px;height:600px}}
</style></head><body><aside><div class="brand">Fazal<em>.</em> Site Manager</div><div class="subtitle">YOUR WEBSITE, YOUR CONTROL</div><nav id="nav"></nav><div class="aside-bottom"><span id="owner">Owner access</span><a href="https://fazalbinmahmood.com" target="_blank" rel="noopener">Open live website ↗</a><a href="/signout-with-chatgpt?return_to=%2Fadmin%2F" target="_top">Sign out</a></div></aside><div class="workspace"><header><div><h1 id="section-title">Overview</h1><div class="header-note" id="last-published">Loading your workspace…</div></div><div class="actions"><span id="save-state" class="badge">Saved</span><button class="btn" id="save">Save draft</button><button class="btn primary" id="publish">Publish changes ↗</button></div></header><main id="main"><div class="loading">Loading your website…</div></main></div><div id="toast" class="toast" role="status" hidden></div><dialog id="confirm"><h2>Publish your changes?</h2><p>Your saved draft will replace the live content and design. The previous version will be kept in Version history.</p><div class="bottom-actions"><button class="btn" id="cancel-publish">Keep editing</button><button class="btn primary" id="confirm-publish">Publish now</button></div></dialog>
<script>
'use strict';let state,doc,tab='Overview',selected=null,dirty=false,busy=false,toastTimer;const $=s=>document.querySelector(s),main=$('#main');const tabs=['Overview','Pages','Blog posts','Projects','Design','Media','Version history'];
function node(tag,props={},children=[]){const e=document.createElement(tag);for(const [k,v]of Object.entries(props)){if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==='text')e.textContent=v;else if(k==='class')e.className=v;else if(k==='value')e.value=v;else e.setAttribute(k,v);}for(const c of children)e.append(c);return e;}
function toast(message,error=false){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').className='toast'+(error?' error':'');$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,6000);}
async function api(action,body){const r=await fetch('/api/admin/'+action,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let data;try{data=await r.json();}catch{throw Error('Could not read the server response. Reload and try again.');}if(!r.ok)throw Error(data.error||'Request failed');return data;}
function setDirty(){dirty=true;$('#save-state').textContent='Unsaved changes';$('#save-state').className='badge dirty';}
function saved(){dirty=false;$('#save-state').textContent='Draft saved';$('#save-state').className='badge';}
function lock(value){busy=value;$('#save').disabled=value;$('#publish').disabled=value;}
async function load(){try{state=await api('state');doc=state.draft;$('#owner').textContent=state.user;$('#last-published').textContent=state.publishedAt?'Last published '+new Date(state.publishedAt).toLocaleString():'Your current website is live · Draft workspace ready';saved();render();}catch(e){main.replaceChildren(node('div',{class:'notice',text:e.message}),node('a',{class:'btn',href:'/signin-with-chatgpt?return_to=%2Fadmin%2F',target:'_top',text:'Sign in again'}));}}
async function save(){if(busy)return false;lock(true);try{const r=await api('save',{revision:state.revision,document:doc});state.revision=r.revision;saved();const f=$('#preview');if(f)f.src=(selected?selected.path:'/')+'?preview=1';toast('Draft saved. Your live site has not changed.');return true;}catch(e){toast(e.message,true);return false;}finally{lock(false);}}
$('#save').onclick=save;$('#publish').onclick=async()=>{if(dirty&&!await save())return;$('#confirm').showModal();};$('#cancel-publish').onclick=()=>$('#confirm').close();$('#confirm-publish').onclick=async()=>{if(busy)return;lock(true);$('#confirm-publish').disabled=true;try{await api('publish',{revision:state.revision});$('#confirm').close();toast('Your changes are live.');await load();}catch(e){toast(e.message,true);}finally{lock(false);$('#confirm-publish').disabled=false;}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
for(const name of tabs)$('#nav').append(node('button',{text:name,onclick:()=>{tab=name;selected=null;render();}}));
function field(label,value,change,kind='input',extra={}){const wrap=node('div',{class:'field'}),id='i'+Math.random().toString(36).slice(2);const input=node(kind,{id,value,...extra,oninput:e=>{change(e.target.value);setDirty();}});wrap.append(node('label',{for:id,text:label}),input);return wrap;}
function preview(path='/'){const panel=node('section',{class:'preview'}),frame=node('iframe',{id:'preview',title:'Saved draft preview',src:path+'?preview=1'});panel.append(node('div',{class:'preview-tools'},[node('strong',{text:'Draft preview'}),node('div',{class:'actions'},[node('button',{class:'btn',text:'Desktop',onclick:()=>frame.style.width='100%'}),node('button',{class:'btn',text:'Mobile',onclick:()=>frame.style.width='390px'})])]),node('div',{class:'preview-wrap'},[frame]),node('p',{class:'hint',text:'Save your draft to refresh the preview. Visitors only see published changes.'}));return panel;}
function intro(title,description){return node('div',{class:'intro'},[node('h2',{text:title}),node('p',{text:description})]);}
function render(){[...$('#nav').children].forEach(b=>b.classList.toggle('active',b.textContent===tab));$('#section-title').textContent=tab;main.replaceChildren();if(!doc)return;if(selected){editPage(selected);return;}
 if(tab==='Overview'){main.append(intro('A clear view of your website.','Manage your content and design here. Save privately, preview, then publish when ready.'));const grid=node('div',{class:'grid'});for(const [label,type,target]of [['Pages','page','Pages'],['Blog posts','blog','Blog posts'],['Projects','project','Projects']])grid.append(node('div',{class:'card'},[node('div',{class:'eyebrow',text:label}),node('div',{class:'metric',text:doc.pages.filter(p=>p.type===type&&!p.hidden).length}),node('button',{class:'btn',text:'Manage '+label.toLowerCase(),onclick:()=>{tab=target;render();}})]));main.append(grid,node('div',{class:'notice',style:'margin-top:24px',text:'Draft → Preview → Publish. Changes stay private until you press Publish changes. A previous version is saved every time you publish.'}),node('div',{class:'card'},[node('h3',{text:'Keep a copy of your work'}),node('p',{text:'Download your content and design settings whenever you need them. Source code is maintained in your GitHub repository.'}),node('button',{class:'btn',text:'Export content & settings',onclick:exportData})]));}
 else if(['Pages','Blog posts','Projects'].includes(tab))listPages();else if(tab==='Design')design();else if(tab==='Media')media();else history();}
function listPages(){const type=tab==='Blog posts'?'blog':tab==='Projects'?'project':'page';main.append(intro(tab,type==='page'?'Edit page titles, text, links and images.':'Manage entries, add new content or hide an entry from the live site.'));const list=node('div',{class:'list'}),search=node('input',{placeholder:'Search '+tab.toLowerCase(),'aria-label':'Search entries',oninput:()=>draw()});const toolbar=node('div',{class:'toolbar'},[search]);if(type!=='page')toolbar.append(node('button',{class:'btn primary',text:'+ New '+(type==='blog'?'post':'project'),onclick:()=>newPage(type)}));main.append(toolbar,list);function draw(){list.replaceChildren();for(const p of doc.pages.filter(p=>p.type===type&&p.title.toLowerCase().includes(search.value.toLowerCase())))list.append(node('div',{class:'row'},[node('div',{},[node('h3',{text:p.title}),node('small',{text:p.path+(p.hidden?' · Hidden':'')+(p.new?' · Added in manager':'')})]),node('button',{class:'btn',text:'Edit',onclick:()=>{selected=p;render();}})]));}draw();}
function newPage(type){const slug='new-'+type+'-'+Date.now().toString(36),p={path:'/'+(type==='blog'?'blog':'projects')+'/'+slug+'/',title:'Untitled '+(type==='blog'?'post':'project'),description:'',type,new:true,hidden:false,fields:[],body:'',image:''};doc.pages.unshift(p);selected=p;setDirty();render();}
function editPage(p){main.append(node('button',{class:'btn',text:'← Back to '+tab.toLowerCase(),onclick:()=>{selected=null;render();}}),node('div',{style:'height:20px'}));const panel=node('div',{class:'panel'}),editor=node('div',{class:'editor'},[panel,preview(p.new?'/':p.path)]);main.append(editor);panel.append(node('h3',{text:p.title}),field('Page title / SEO title',p.title,v=>p.title=v),field('Search description',p.description,v=>p.description=v,'textarea',{maxlength:600}));if(p.new)panel.append(field('Page URL',p.path,v=>p.path=v),node('p',{class:'hint',text:'Use lowercase letters, numbers and hyphens. Keep the leading and trailing slash.'}));if(p.path!=='/')panel.append(node('label',{},[node('input',{type:'checkbox',...(p.hidden?{checked:''}:{}),onchange:e=>{p.hidden=e.target.checked;setDirty();}}),node('span',{text:'Hide this page from visitors'})]));
 if(p.new){panel.append(imageField('Cover image',p.image,v=>p.image=v),field('Article content',p.body,v=>p.body=v,'textarea',{style:'min-height:350px'}),node('p',{class:'hint',text:'Separate paragraphs with a blank line. Start a heading with ## followed by a space.'}));}
 else{panel.append(node('h3',{class:'section-title',text:'Page content'}),node('p',{class:'hint',text:'Edit headings, paragraphs, buttons and images below. Changing text replaces any inline formatting in that text block.'}));for(const f of p.fields){if(f.kind==='image'){panel.append(imageField('Image',f.value,v=>f.value=v),field('Image description',f.alt,v=>f.alt=v));}else{panel.append(field(({h1:'Main heading',h2:'Section heading',h3:'Subheading',p:'Paragraph',a:'Link / button'})[f.tag]||'Text',f.value,v=>f.value=v,f.value.length>100?'textarea':'input'));if(f.kind==='link')panel.append(field('Link destination',f.href,v=>f.href=v));}}}}
function imageField(label,value,change){const wrap=field(label+' URL',value,change),img=node('img',{class:'image-preview',src:value||'/assets/favicon.svg',alt:'Image preview'}),upload=node('input',{type:'file',accept:'image/png,image/jpeg,image/webp',class:'file-input',onchange:async e=>{const file=e.target.files[0];if(!file)return;try{const url=await uploadImage(file);change(url);wrap.querySelector('input:not([type=file])').value=url;img.src=url;setDirty();toast('Image uploaded. Save and publish to use it.');}catch(e){toast(e.message,true);}}});wrap.append(img,upload,node('button',{class:'btn',text:'Upload image',onclick:()=>upload.click()}));return wrap;}
async function uploadImage(file){if(file.size>5*1024*1024)throw Error('Choose an image smaller than 5MB.');const r=await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':file.type},body:file});const d=await r.json();if(!r.ok)throw Error(d.error||'Upload failed');return d.url;}
function themeCSS(t){return `:root{--rose:${t.soft};--ink:${t.text};--teal:${t.accent}}body{background:${t.background};color:${t.text};font-family:'${t.bodyFont}',sans-serif;font-size:${t.bodySize}px}h1,h2,h3,.signature{font-family:'${t.headingFont}',sans-serif}h1,.hero h1,.article h1{font-size:${t.heroSize}px}h2,.intro h2,.projects h2,.testimonials h2,.guides h2,.blog-hero h1{font-size:${t.headingSize}px}.hero-copy p,.intro p,.project-card p,.article p,.article li,.blog-card p,.blog-hero p{font-size:${t.bodySize}px}.solid{background:${t.accent};border-color:${t.accent}}.button{border-radius:${t.buttonRadius}px}.guide-cover,.guide-cover.c2{background:${t.guide};color:white}.hero,.projects,.header{color:white}@media(max-width:767px){h1,.hero h1,.article h1{font-size:${t.mobileHeroSize}px}h2,.intro h2,.projects h2,.testimonials h2,.guides h2,.blog-hero h1{font-size:${t.mobileHeadingSize}px}}`;}
function design(){main.append(intro('Make it feel like your brand.','Adjust typography and colours. Preview design changes immediately; save and publish to make them live.'));const panel=node('div',{class:'panel'});main.append(node('div',{class:'editor'},[panel,preview()]));const update=()=>{setDirty();$('#preview')?.contentWindow.postMessage({type:'theme-preview',css:themeCSS(doc.theme)},location.origin);};for(const [key,label]of [['headingFont','Heading font'],['bodyFont','Body font']]){const s=node('select',{onchange:e=>{doc.theme[key]=e.target.value;update();}});for(const font of ['Inter Display','Inter','Arial','Georgia','system-ui'])s.append(node('option',{value:font,text:font,...(doc.theme[key]===font?{selected:''}:{})}));panel.append(node('label',{text:label}),s);}for(const [key,label,min,max]of [['heroSize','Desktop hero size',24,90],['headingSize','Desktop section headings',20,64],['bodySize','Body text size',14,24],['mobileHeroSize','Mobile hero size',24,52],['mobileHeadingSize','Mobile section headings',20,40],['buttonRadius','Button roundness',0,100]]){const out=node('span',{text:doc.theme[key]+'px'});panel.append(node('label',{text:label}),node('div',{class:'split'},[node('input',{type:'range',min,max,value:doc.theme[key],oninput:e=>{doc.theme[key]=Number(e.target.value);out.textContent=e.target.value+'px';update();}}),out]));}for(const [key,label]of [['accent','Accent / button colour'],['soft','Soft section background'],['text','Body text'],['background','Page background'],['guide','Guide cover background']])panel.append(node('label',{text:label}),node('input',{type:'color',value:doc.theme[key],oninput:e=>{doc.theme[key]=e.target.value;update();}}));}
function media(){main.append(intro('Your image library.','Upload PNG, JPEG or WebP files up to 5MB. Copy a URL or choose Upload image inside a page editor.'));const input=node('input',{type:'file',accept:'image/png,image/jpeg,image/webp',onchange:async e=>{try{const url=await uploadImage(e.target.files[0]);main.append(node('div',{class:'card',style:'margin-top:20px'},[node('img',{src:url,class:'image-preview',alt:'Uploaded image'}),node('input',{value:location.origin+url,readonly:'','aria-label':'Uploaded image URL'})]));toast('Image uploaded. Copy its URL to use it in a page.');}catch(e){toast(e.message,true);}}});main.append(node('div',{class:'card'},[input]));const images=[...new Set(doc.pages.flatMap(p=>[p.image,...p.fields.filter(f=>f.kind==='image').map(f=>f.value)]).filter(Boolean))];const grid=node('div',{class:'grid',style:'margin-top:20px'});for(const src of images)grid.append(node('div',{class:'card'},[node('img',{src,class:'image-preview',alt:'Website media',loading:'lazy'}),node('input',{value:src,readonly:'','aria-label':'Image URL'})]));main.append(grid);}
function history(){main.append(intro('A way back, whenever you need it.','The last 10 published versions are kept. Restore a version into your draft, review it, then publish.'));if(!state.history.length){main.append(node('div',{class:'card empty',text:'Your first backup will appear after you publish from this portal.'}));return;}for(const v of state.history)main.append(node('div',{class:'row'},[node('div',{},[node('h3',{text:new Date(v.at).toLocaleString()}),node('small',{text:'Published content and design settings'})]),node('button',{class:'btn',text:'Restore to draft',onclick:async()=>{if(dirty&&!confirm('Replace your unsaved changes with this version?'))return;try{await api('restore',{revision:state.revision,id:v.id});await load();toast('Version restored to draft. Review it before publishing.');}catch(e){toast(e.message,true);}}})]));}
async function exportData(){try{const d=await api('export'),a=node('a',{href:URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})),download:'fazal-website-content-'+new Date().toISOString().slice(0,10)+'.json'});a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){toast(e.message,true);}}
load();
</script></body></html>
